<!DOCTYPE html>
<!--
  TEMPLATE-OF-RECORD for the Expo web export (dist/index.html).

  NOTE: `npm run web:build` (expo export --platform web) generates dist/index.html
  itself and injects <title> + theme-color from app.json (expo.web.name / themeColor).
  Expo does NOT use this file as its HTML template out of the box. To reproduce the
  splash screen, manifest links, and background below on a real build, a custom HTML
  template must be wired up (e.g. via a Metro/web template override); until then,
  dist/index.html is hand-edited to match this reference head.
-->
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Xcellence POS — ระบบขายหน้าร้าน</title>
    <meta name="description" content="ระบบขายหน้าร้าน PWA — ชำระเงิน คูปอง สมาชิก CRM กะการขาย ใบเสร็จ รองรับออฟไลน์" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #FFF8F8;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #FFF8F8;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: #FFF8F8;
        z-index: 9999;
      }
      #splash svg {
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      #splash .splash-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        color: #E23744;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.92); }
      }
    </style>
    <meta name="theme-color" content="#E23744">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="icon" href="/icon-pos.svg">
  </head>

  <body>
    <noscript>
      กรุณาเปิดใช้งาน JavaScript
    </noscript>
    <div id="root">
      <div id="splash">
        <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Xcellence POS">
          <rect x="8" y="8" width="80" height="80" rx="20" fill="#E23744" />
          <text x="48" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" fill="#FFF8F8">X</text>
        </svg>
        <div class="splash-text">กำลังโหลด POS...</div>
      </div>
    </div>
    <!-- The hashed /_expo bundle script is injected by `expo export` at build time. -->
  </body>
</html>
